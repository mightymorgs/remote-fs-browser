---
- name: Deploy remotefs on macOS
  hosts: filesystem_hosts
  gather_facts: false
  become: true
  vars:
    remote_fs_platform: macos
  tasks:
    - name: Require the Homebrew owner for dependency installation
      ansible.builtin.assert:
        that: remote_fs_brew_user is defined or remote_fs_skip_dependencies | default(false) | bool
    - name: Install and configure remotefs
      ansible.builtin.import_tasks: ../tasks/unix-install.yml
