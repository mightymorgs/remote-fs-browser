<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job tracker</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d2330;background:#f6f4f0}
  header{display:flex;align-items:center;gap:12px;padding:16px 32px;background:#1f2a24;color:#f3efe6}
  header .logo{width:26px;height:26px;border-radius:7px;background:#d98b3a}
  header h1{margin:0;font-size:18px;font-weight:600}
  header nav{margin-left:auto;display:flex;gap:22px;font-size:14px;color:#c9c2b3}
  main{max-width:980px;margin:36px auto;padding:0 24px}
  h2{margin:0 0 4px;font-size:26px}
  .sub{margin:0 0 26px;color:#6b6556}
  form{background:#fff;border:1px solid #e4dfd4;border-radius:14px;padding:26px;display:grid;gap:18px}
  label{display:grid;gap:6px;font-size:13px;color:#6b6556;font-weight:500}
  input{font:inherit;padding:10px 12px;border:1px solid #d7d1c4;border-radius:9px;background:#fffdf9;color:#1d2330}
  .row{display:flex;gap:10px}.row input{flex:1}
  button{font:inherit;padding:10px 16px;border-radius:9px;border:1px solid #d7d1c4;background:#fff;cursor:pointer}
  button.primary{background:#d98b3a;border-color:#c07428;color:#fff;font-weight:600}
  pre{margin:0;padding:12px 14px;border-radius:9px;background:#f3f0e9;font:12.5px/1.5 ui-monospace,Menlo,monospace;color:#4a4435;white-space:pre-wrap}
  dialog{width:min(1100px,94vw);height:min(680px,86vh);padding:0;border:0;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(25,30,28,.45)}
  dialog .top{display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid #eee;font-weight:600}
  dialog .top button{margin-left:auto}
  remote-fs-browser{display:block;height:calc(100% - 55px)}
</style>
</head>
<body>
<header><span class="logo"></span><h1>Harbour Lane · Job tracker</h1><nav><span>Jobs</span><span>Clients</span><span>Invoices</span></nav></header>
<main>
  <h2>New job</h2>
  <p class="sub">Link the job to the folder where its files live: on this server, a NAS share or cloud storage.</p>
  <form id="job" onsubmit="event.preventDefault()">
    <label>Job name<input value="Autumn campaign shoot"></label>
    <label>Client<input value="Harbour Lane"></label>
    <label>Delivery folder
      <span class="row"><input id="folder" placeholder="No folder chosen" readonly><button type="button" id="choose">Choose folder…</button></span>
    </label>
    <label>Stored with the job (no credentials)<pre id="descriptor">—</pre></label>
    <div><button class="primary">Create job</button></div>
  </form>
</main>
<dialog id="picker-dialog">
  <div class="top">Choose a delivery folder<button type="button" id="close">Cancel</button></div>
  <remote-fs-browser mode="select"></remote-fs-browser>
</dialog>
<script type="module">
  // The README frontend template, pointed at the API mounted under /storage-api.
  import { RemoteFsClient } from '/storage-api/browser.js'
  const dialog = document.querySelector('#picker-dialog')
  const picker = document.querySelector('remote-fs-browser')
  picker.client = new RemoteFsClient('/storage-api/api')
  document.querySelector('#choose').onclick = async () => { dialog.showModal(); await picker.discover() }
  document.querySelector('#close').onclick = () => dialog.close()
  picker.addEventListener('path-selected', event => {
    const d = event.detail
    const where = d.type === 'smb' ? `smb://${d.host}/${d.share}` : d.type === 'local' ? d.root : `${d.type}:${d.endpoint || d.host}`
    document.querySelector('#folder').value = `${where}${d.path === '/' ? '' : d.path}`
    document.querySelector('#descriptor').textContent = JSON.stringify(d, null, 2)
    dialog.close()
  })
</script>
</body>
</html>
