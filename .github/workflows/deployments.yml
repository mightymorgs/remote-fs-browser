name: Automated deployment checks
on:
  push:
    paths: ['scripts/**', 'playbooks/**', 'tests/*deployment*', '.github/workflows/deployments.yml']
  pull_request:
    paths: ['scripts/**', 'playbooks/**', 'tests/*deployment*', '.github/workflows/deployments.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  services:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible controller
        if: runner.os != 'Windows'
        run: python -m pip install 'ansible-core>=2.19,<2.21'
      - name: Install, exercise, redeploy, rotate password and uninstall service
        run: python tests/deployment_smoke.py
