name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Push the container image (as sha-<commit> only) after it builds
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  windows-portable:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned libnfs.dll
        id: libnfs
        uses: ./.github/actions/build-libnfs
      - name: Install package and PyInstaller
        run: python -m pip install . pyinstaller
      - name: Freeze one-folder build
        run: pyinstaller --noconfirm packaging/remotefs.spec
      - name: Bundle libnfs.dll next to remotefs.exe
        shell: pwsh
        run: |
          # cli.py points LIBNFS_LIBRARY at this file when running frozen.
          Copy-Item "${{ steps.libnfs.outputs.library }}" dist/remotefs/libnfs.dll
          if (!(Test-Path dist/remotefs/remotefs.exe)) { throw 'PyInstaller did not produce remotefs.exe' }
      - name: Bundle pinned rclone.exe next to remotefs.exe
        shell: pwsh
        run: |
          # Cloud browsing and mounts use this rclone (cli.py puts the executable's folder first on PATH).
          # WinFsp is not bundled: remotefs installs the official installer on demand (see mounts.py).
          $Version = 'v1.75.1'
          $Sha256 = '200eb602c126d82aa38b51e0f6b9ae837473ff99b51278d3f6f837574c494d6e'
          $Zip = "$env:RUNNER_TEMP/rclone.zip"
          Invoke-WebRequest "https://github.com/rclone/rclone/releases/download/$Version/rclone-$Version-windows-amd64.zip" -OutFile $Zip
          if ((Get-FileHash $Zip -Algorithm SHA256).Hash.ToLower() -ne $Sha256) { throw 'rclone archive checksum mismatch' }
          Expand-Archive $Zip -DestinationPath "$env:RUNNER_TEMP/rclone"
          $Folder = "$env:RUNNER_TEMP/rclone/rclone-$Version-windows-amd64"
          Copy-Item "$Folder/rclone.exe" dist/remotefs/rclone.exe
          New-Item -ItemType Directory -Force dist/remotefs/licenses/rclone | Out-Null
          Copy-Item "$Folder/README.txt" dist/remotefs/licenses/rclone/README.txt
          Invoke-WebRequest "https://raw.githubusercontent.com/rclone/rclone/$Version/COPYING" -OutFile dist/remotefs/licenses/rclone/COPYING
      - name: Bundle third-party licences and matching libnfs source
        shell: pwsh
        run: |
          $LicenseArgs = @('--output', 'dist/remotefs/licenses')
          $HasImpacket = python -c "import importlib.util; print(bool(importlib.util.find_spec('impacket')))"
          if ($HasImpacket -eq 'True') { $LicenseArgs += @('--include', 'impacket') }
          python packaging/bundle_licenses.py @LicenseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Dependency licence collection failed' }
          python packaging/bundle_libnfs.py --source "$env:RUNNER_TEMP/libnfs" --bundle dist/remotefs --build-recipe .github/actions/build-libnfs/action.yml
          if ($LASTEXITCODE -ne 0) { throw 'libnfs source collection failed' }
          python packaging/bundle_toolchain.py --toolchain "${{ steps.libnfs.outputs.toolchain }}" --compiler "${{ steps.libnfs.outputs.compiler }}" --output dist/remotefs/licenses/mingw
          if ($LASTEXITCODE -ne 0) { throw 'MinGW runtime licence collection failed' }
          Copy-Item LICENSE dist/remotefs/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md dist/remotefs/THIRD_PARTY_NOTICES.md
      - name: Smoke test frozen binary
        run: python packaging/smoke_windows.py
      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Zip portable folder
        shell: pwsh
        run: |
          # Archive root is remotefs/, so the winget manifest's RelativeFilePath is remotefs/remotefs.exe.
          Compress-Archive -Path dist/remotefs -DestinationPath "remotefs-${{ steps.version.outputs.version }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: remotefs-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  container:
    # linux/amd64 + linux/arm64 image on GHCR. A v* tag publishes <version>,
    # sha-<commit> and (except release candidates) latest; a manual run builds
    # both platforms and, with `publish`, pushes sha-<commit> only, so a
    # one-off build never moves a version tag.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image tags
        id: tags
        env:
          REPOSITORY: ${{ github.repository }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tags="${image}:sha-${GITHUB_SHA}"
          push=false
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            declared=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
            [[ "$version" == "$declared" ]] || { echo "Tag $GITHUB_REF_NAME does not match pyproject version $declared" >&2; exit 1; }
            tags="${tags},${image}:${version}"
            [[ "$version" == *rc* ]] || tags="${tags},${image}:latest"
            push=true
          elif [[ "$PUBLISH_INPUT" == true ]]; then
            push=true
          fi
          {
            echo "tags=$tags"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=remotefs
          cache-to: type=gha,mode=max,scope=remotefs

  publish:
    needs: [build, windows-portable]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: windows
      - name: Publish release candidate to TestPyPI
        if: contains(github.ref_name, 'rc')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          files: |
            dist/*.tar.gz
            dist/*.whl
            windows/*.zip
