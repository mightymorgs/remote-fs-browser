name: Cross-platform checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -e ".[test]"
      - name: Build pinned libnfs
        uses: ./.github/actions/build-libnfs
      - name: SDK, HTTP and native ABI tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser discovery tests
        run: node --test frontend/browser.test.js
      - name: Build distribution
        run: python -m build

  brew-libnfs:
    # Proves the Homebrew-packaged libnfs (what the formula depends on) loads
    # through the same ctypes ABI as the pinned source build above.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -e ".[test]"
      - name: Install Homebrew libnfs
        run: brew install libnfs
      - name: Native ABI tests against Homebrew libnfs
        run: |
          export LIBNFS_LIBRARY="$(brew --prefix)/lib/libnfs.dylib"
          test -f "$LIBNFS_LIBRARY"
          python -m pytest -q tests/test_native.py

  protocol-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: ./.github/actions/build-libnfs
      - name: Start isolated SMB and NFS test servers
        run: |
          docker build -t remotefs-protocol-tests:local tests/protocol
          docker run -d --name remotefs-protocol-tests -p 127.0.0.1:445:445 -p 127.0.0.1:2049:2049 remotefs-protocol-tests:local
          python - <<'PYTHON'
          import socket, time
          for port in (445, 2049):
              for attempt in range(60):
                  try:
                      with socket.create_connection(('127.0.0.1', port), timeout=1):
                          break
                  except OSError:
                      time.sleep(1)
              else:
                  raise RuntimeError(f'Test server port {port} did not start')
          PYTHON
      - name: Exercise real protocol mutations
        run: python tests/protocol/exercise.py
      - name: Stop test servers
        if: always()
        run: docker rm -f remotefs-protocol-tests || true
