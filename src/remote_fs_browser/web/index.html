<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Remote FS Browser</title>
<style>
:root{
  --accent:#3f6fd1; --accent-dark:#2b57ae; --accent-ink:#22417d; --accent-line:#b6c6e8; --accent-wash:#eef2fb;
  --ink:#1c2024; --muted:#4d545c; --dim:#6a727c; --line:#dcdfe4;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:linear-gradient(140deg,#e7ecf5 0%,#f4f2ef 46%,#e4edf1 100%);
}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-dark)}
code{font-family:var(--mono)}
button,input{font:inherit;color:var(--ink)}
button{cursor:pointer}
.btn{font-size:15px;min-height:44px;padding:0 18px;border:1px solid #d5d9df;border-radius:9px;background:rgba(255,255,255,.8)}
.btn:hover{background:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent-dark);color:#fff;font-weight:500}
.btn.primary:hover{background:#3563c4}
.eyebrow{font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0}

/* ---------- sign-in ---------- */
#signin{min-height:100%;display:grid;place-items:center;padding:24px}
#signin[hidden]{display:none}
.card{
  width:min(440px,100%);display:flex;flex-direction:column;gap:18px;padding:26px;
  background:rgba(255,255,255,.62);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid rgba(255,255,255,.75);border-radius:14px;box-shadow:0 12px 34px rgba(20,24,30,.09);
}
.card .lede{display:flex;flex-direction:column;gap:7px}
.card .badge{display:flex;align-items:center;gap:10px}
.card .mark{width:22px;height:18px;border-radius:3px;background:var(--accent)}
.card .badge span{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.card h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
.card p{margin:0;font-size:14px;color:var(--muted);text-wrap:pretty}
.card label{display:grid;gap:7px;font-size:13px;color:var(--muted)}
.card input{font:15px var(--mono);padding:11px 13px;border:1px solid #c8ccd3;border-radius:8px;background:rgba(255,255,255,.9);box-shadow:inset 0 1px 1px rgba(20,24,30,.04)}
.card input:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card .note{font-size:12px;color:var(--dim);text-wrap:pretty}
.card .go{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card .go span{font-size:13px;color:var(--dim)}
.card .service{border-top:1px solid #e6e8ec;padding-top:14px;display:flex;flex-direction:column;gap:4px}
.card .service code{font-size:13px;overflow-wrap:anywhere}
.card .service .warn{font-size:12px;color:#8a5a12}
#login-status{min-height:20px;font-size:13px;color:var(--accent-ink)}
#login-status[data-state=error]{color:#7e2c20}

/* ---------- app ---------- */
#app{height:100%;display:none}
#app[data-ready]{display:block}
remote-fs-browser{display:block;height:100%}
#saved-toast{
  position:fixed;inset:auto 16px 16px auto;max-width:min(420px,calc(100vw - 32px));
  display:none;gap:12px;padding:14px;border:1px solid var(--accent-line);background:var(--accent-wash);border-radius:11px;
  box-shadow:0 10px 26px rgba(20,24,30,.12);
}
#saved-toast[data-open]{display:flex}
#saved-toast .bar{width:4px;border-radius:2px;background:var(--accent);flex:none}
#saved-toast .body{display:flex;flex-direction:column;gap:6px;min-width:0}
#saved-toast strong{font-size:14px;font-weight:500;color:var(--accent-ink)}
#saved-toast pre{margin:0;font:12px/1.5 var(--mono);color:var(--accent-ink);white-space:pre-wrap;overflow-wrap:anywhere;max-height:120px;overflow:auto}
#saved-toast button{align-self:flex-start;font-size:13px;min-height:36px;padding:0 12px;border:1px solid var(--accent-line);border-radius:8px;background:rgba(255,255,255,.7);color:var(--accent-ink)}
</style>
</head>
<body>

<main id="signin">
  <form class="card" id="signin-form">
    <div class="lede">
      <div class="badge"><span class="mark"></span><span>remote-fs-browser</span></div>
      <h1 id="signin-title">Sign in to this host</h1>
      <p>Sign in with the account configured on this host.</p>
    </div>
    <label>Username
      <input id="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="current-password" required>
      <span class="note">To reset your password, run <code>remotefs account</code> on the host and restart the service.</span>
    </label>
    <div class="go">
      <button class="btn primary" type="submit" id="start">Sign in</button>
      <span>Access lasts eight hours.</span>
    </div>
    <p id="login-status" role="status"></p>
    <div class="service">
      <span class="eyebrow">Serving on</span>
      <code id="origin"></code>
      <span class="warn" id="transport"></span>
    </div>
  </form>
</main>

<div id="app">
  <remote-fs-browser signout></remote-fs-browser>
</div>

<aside id="saved-toast" role="status">
  <div class="bar"></div>
  <div class="body">
    <strong>Folder selected</strong>
    <pre id="result"></pre>
    <button type="button" id="copy">Copy descriptor</button>
  </div>
</aside>

<script type="module" src="/demo.js"></script>
</body>
</html>
